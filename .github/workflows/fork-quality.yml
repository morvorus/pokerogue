name: Fork quality gate

on:
  pull_request:
    branches:
      - beta
  workflow_dispatch:

concurrency:
  group: fork-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source and data submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps

      - name: Typecheck
        run: pnpm typecheck

      - name: Build personal offline mode
        run: pnpm build
        env:
          VITE_BYPASS_LOGIN: "1"
          VITE_BYPASS_TUTORIAL: "0"
          VITE_SERVER_URL: http://localhost:8001

      - name: Prepare and verify provider-neutral release
        run: |
          node scripts/prepare-hosting-release.mjs dist
          node scripts/verify-hosting-release.mjs dist
        env:
          VERIFY_ALL: "1"

      - name: Enforce GitHub Pages size budget
        run: node scripts/check-deployment-budget.mjs dist
        env:
          WARN_DEPLOYMENT_BYTES: "891289600"
          MAX_DEPLOYMENT_BYTES: "943718400"
          MAX_DEPLOYMENT_FILES: "100000"
