name: Deploy Personal Game to GitHub Pages

on:
  push:
    branches:
      - beta
  workflow_dispatch:

concurrency:
  group: personal-github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source and data submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build personal offline mode
        run: pnpm build
        env:
          VITE_BYPASS_LOGIN: "1"
          VITE_BYPASS_TUTORIAL: "0"
          VITE_SERVER_URL: http://localhost:8001

      - name: Prepare provider-neutral hosting release
        run: node scripts/prepare-hosting-release.mjs dist

      - name: Verify critical release files
        run: node scripts/verify-hosting-release.mjs dist
        env:
          VERIFY_ALL: "1"

      - name: Enforce production security policy
        run: node scripts/check-production-security.mjs dist

      - name: Enforce GitHub Pages safety margin
        run: node scripts/check-deployment-budget.mjs dist
        env:
          WARN_DEPLOYMENT_BYTES: "891289600"
          MAX_DEPLOYMENT_BYTES: "943718400"
          MAX_DEPLOYMENT_FILES: "100000"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
